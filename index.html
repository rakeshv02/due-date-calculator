<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<meta name="description" content="Free pregnancy due date calculator. Enter your last period or conception date and get your estimated due date, trimester timeline and key milestones."/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}
nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}
nav .brand{color:#38bdf8;font-weight:700;font-size:18px}
.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}
#app{max-width:560px;margin:36px auto;padding:0 20px 40px}
h1{font-size:26px;font-weight:700;text-align:center;margin-bottom:6px}
.subtitle{text-align:center;color:#94a3b8;margin-bottom:24px;font-size:14px}
.card{background:#1e293b;border-radius:18px;padding:22px;border:1px solid #334155;margin-bottom:14px}
.tabs{display:flex;gap:4px;background:#0f172a;border-radius:10px;padding:4px;margin-bottom:18px}
.tab{flex:1;border:none;border-radius:7px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;background:none;color:#64748b;transition:all .15s}
.tab.active{background:#ec4899;color:#fff}
.field{margin-bottom:14px}
label{display:block;font-size:13px;color:#94a3b8;margin-bottom:5px}
input[type=date],input[type=number]{width:100%;background:#0f172a;color:#f1f5f9;border:1px solid #334155;border-radius:10px;padding:11px 14px;font-size:16px}
input[type=date]{color-scheme:dark}
.due-box{background:linear-gradient(135deg,#831843,#ec4899);border-radius:16px;padding:28px;text-align:center;margin-bottom:14px}
.due-label{font-size:13px;color:#fce7f3;margin-bottom:6px}
.due-date{font-size:36px;font-weight:800;color:#fff}
.due-sub{font-size:14px;color:#fbcfe8;margin-top:4px}
.stats-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stat-box{flex:1;min-width:120px;background:#1e293b;border-radius:14px;padding:16px;border:1px solid #334155;text-align:center}
.stat-num{font-size:26px;font-weight:700;color:#ec4899}
.stat-lbl{font-size:12px;color:#64748b;margin-top:3px}
.timeline{display:flex;flex-direction:column;gap:0}
.milestone-row{padding:12px 0;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
.milestone-row:last-child{border-bottom:none}
.ms-name{font-size:14px}
.ms-date{font-size:14px;font-family:monospace;color:#ec4899}
.ms-week{font-size:12px;color:#64748b;margin-top:2px}
.trimester-badge{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:700}
.t1{background:#1e3a5f;color:#93c5fd}
.t2{background:#14532d;color:#86efac}
.t3{background:#4a1942;color:#f0abfc}
</style>
</head>
<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="app">
  <h1>Pregnancy Due Date Calculator</h1>
  <p class="subtitle">Estimated due date · Trimesters · Key milestones</p>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="setMethod('lmp')">Last Period (LMP)</button>
      <button class="tab" onclick="setMethod('conception')">Conception Date</button>
      <button class="tab" onclick="setMethod('ultrasound')">Ultrasound</button>
    </div>
    <div class="field">
      <label id="date-label">First day of last period</label>
      <input type="date" id="date-inp" oninput="calc()"/>
    </div>
    <div class="field" id="cycle-field">
      <label>Cycle length (days)</label>
      <input type="number" id="cycle-len" value="28" min="20" max="45" oninput="calc()"/>
    </div>
    <div class="field" id="weeks-field" style="display:none">
      <label>Weeks at ultrasound</label>
      <input type="number" id="us-weeks" placeholder="12" min="4" max="40" oninput="calc()"/>
    </div>
  </div>
  <div id="results" style="display:none">
    <div class="due-box">
      <div class="due-label">🤰 Estimated Due Date</div>
      <div class="due-date" id="due-date"></div>
      <div class="due-sub" id="due-sub"></div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="weeks-preg"></div><div class="stat-lbl">Weeks pregnant</div></div>
      <div class="stat-box"><div class="stat-num" id="days-left"></div><div class="stat-lbl">Days to go</div></div>
      <div class="stat-box"><div class="stat-num" id="trimester-num"></div><div class="stat-lbl">Trimester</div></div>
    </div>
    <div class="card">
      <h2 style="font-size:14px;font-weight:600;margin-bottom:14px">Key Milestones</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>
</div>
<script>
var method = 'lmp';
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function setMethod(m){
  method=m;
  document.querySelectorAll('.tab').forEach(function(b,i){ b.className='tab'+((['lmp','conception','ultrasound'][i])===m?' active':''); });
  document.getElementById('cycle-field').style.display=m==='lmp'?'block':'none';
  document.getElementById('weeks-field').style.display=m==='ultrasound'?'block':'none';
  var labels={lmp:'First day of last period',conception:'Conception date',ultrasound:'Date of ultrasound'};
  document.getElementById('date-label').textContent=labels[m];
  calc();
}

function fmtDate(d){ return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }

function calc(){
  var dateVal=document.getElementById('date-inp').value;
  if(!dateVal){ document.getElementById('results').style.display='none'; return; }
  var inp=new Date(dateVal+'T00:00:00');
  var lmpDate;
  if(method==='lmp'){
    var cycle=parseInt(document.getElementById('cycle-len').value)||28;
    lmpDate=addDays(inp,-(cycle-28));
  } else if(method==='conception'){
    lmpDate=addDays(inp,-14);
  } else {
    var usWeeks=parseInt(document.getElementById('us-weeks').value)||12;
    lmpDate=addDays(inp,-(usWeeks*7));
  }
  var dueDate=addDays(lmpDate,280);
  var today=new Date(); today.setHours(0,0,0,0);
  var daysPreg=Math.floor((today-lmpDate)/86400000);
  var weeksPreg=Math.floor(daysPreg/7);
  var daysLeft=Math.floor((dueDate-today)/86400000);
  var trimester=weeksPreg<13?1:weeksPreg<27?2:3;

  document.getElementById('results').style.display='block';
  document.getElementById('due-date').textContent=fmtDate(dueDate);
  document.getElementById('due-sub').textContent=daysLeft>0?daysLeft+' days to go':daysLeft===0?'Today is your due date!':'Due date was '+Math.abs(daysLeft)+' days ago';
  document.getElementById('weeks-preg').textContent=Math.max(0,weeksPreg)+'w '+Math.max(0,daysPreg%7)+'d';
  document.getElementById('days-left').textContent=Math.max(0,daysLeft);
  document.getElementById('trimester-num').textContent=trimester+'st/nd/rd'.split('/')[trimester-1]||trimester;

  var milestones=[
    {name:'Heartbeat detectable',week:6,badge:'t1'},
    {name:'End of 1st Trimester',week:13,badge:'t1'},
    {name:'Anatomy scan',week:20,badge:'t2'},
    {name:'Viability milestone',week:24,badge:'t2'},
    {name:'End of 2nd Trimester',week:27,badge:'t2'},
    {name:'Full term (early)',week:37,badge:'t3'},
    {name:'Full term',week:39,badge:'t3'},
    {name:'Estimated due date',week:40,badge:'t3'},
  ];
  var tl=document.getElementById('timeline'); tl.innerHTML='';
  milestones.forEach(function(m){
    var mDate=addDays(lmpDate,m.week*7);
    var past=mDate<today;
    var row=document.createElement('div'); row.className='milestone-row';
    row.style.opacity=past?'0.5':'1';
    row.innerHTML='<div><div class="ms-name">'+(past?'✓ ':'')+m.name+'</div><div class="ms-week">Week '+m.week+'</div></div>'+
      '<div style="text-align:right"><div class="ms-date">'+fmtDate(mDate)+'</div><span class="trimester-badge '+m.badge+'">T'+({'t1':1,'t2':2,'t3':3}[m.badge])+'</span></div>';
    tl.appendChild(row);
  });
}
</script>
</body>
</html>
